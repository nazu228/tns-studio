[package]
name = "tns-pdf"
version = "0.1.0"
edition = "2021"
description = "PDFium-based parser for TNS electricity statements (vector grid)"

[lib]
name = "tns_pdf"
path = "src/lib.rs"

[[bin]]
name = "tns-pdf"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tns-core = { path = "../tns-core" }
tns-excel = { path = "../tns-excel" }

[dev-dependencies]
tempfile = "3.27.0"
