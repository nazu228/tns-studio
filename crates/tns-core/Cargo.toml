[package]
name = "tns-core"
version = "0.1.0"
edition = "2021"
description = "Pure TNS statement parsing and calculation logic (Rust port of legacy core_engine.py/tns_input.py)"

[lib]
name = "tns_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tns-excel = { path = "../tns-excel" }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
