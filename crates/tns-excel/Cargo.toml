[package]
name = "tns-excel"
version = "0.1.0"
edition = "2021"
description = "XLSX read/write wrapper for TNS Energy Studio (umya-spreadsheet)"

[lib]
name = "tns_excel"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.45"
umya-spreadsheet = "3.1.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
