name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/parity/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install UI dependencies
        run: npm --prefix apps/ui ci --no-audit --no-fund

      - name: Install parity dependencies
        run: python -m pip install -r tests/parity/requirements.txt

      - name: Verify
        shell: pwsh
        run: .\scripts\verify.ps1 -RequireRustOutput

      - name: Require updater signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }

      - name: Build NSIS and updater artifacts
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Authenticode sign (optional)
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows Kits" }
          $cert = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object {
              & $signtool.FullName sign /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            }
          } finally {
            Remove-Item $cert -Force -ErrorAction SilentlyContinue
          }

      - name: Generate latest.json
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $config.version
          $tag = "${{ github.ref_name }}"
          $asset = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.nsis.zip" |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $asset) { throw "Updater archive (*.nsis.zip) not found" }
          $signature = "$($asset.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) {
            throw "Updater signature not found: $signature. Check TAURI_SIGNING_PRIVATE_KEY."
          }
          .\scripts\release-latest-json.ps1 `
            -Version $version `
            -Tag $tag `
            -AssetPath $asset.FullName `
            -SignaturePath $signature `
            -OutputPath latest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TNS Energy Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
