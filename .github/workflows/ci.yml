name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch guard base
        run: git fetch origin +parity-harness:refs/remotes/origin/parity-harness

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/parity/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install UI dependencies
        run: npm --prefix apps/ui ci --no-audit --no-fund

      - name: Install parity dependencies
        run: python -m pip install -r tests/parity/requirements.txt

      - name: Verify
        shell: pwsh
        run: .\scripts\verify.ps1 -RequireRustOutput
