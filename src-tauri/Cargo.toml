[package]
name = "tns-studio"
version = "0.2.1"
edition = "2021"
description = "TNS Energy Studio — Tauri desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tns-core = { path = "../crates/tns-core" }
tns-db = { path = "../crates/tns-db" }
tns-excel = { path = "../crates/tns-excel" }
tns-pdf = { path = "../crates/tns-pdf" }
